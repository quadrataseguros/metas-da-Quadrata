<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Quadrata - Metas</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e4e7ec;--fg:#111827;--fg2:#4b5563;--brand:#1d4ed8;--brand-soft:#e8f1fe;--bad:#d14343}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px 24px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:48px;height:48px;border-radius:12px;background:#fff;padding:3px}
.brand b{font-family:"Inter",sans-serif;font-weight:600;font-size:20px;display:block}
.brand small{color:var(--fg2);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:6px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;font:inherit;font-weight:600;color:var(--fg2);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button.go{width:100%;margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:6px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.hint{color:var(--fg2);font-size:12.5px;margin-top:6px}
</style></head><body>
<form class="box" id="f">
  <div class="brand"><img src="/logo.png" alt="Quadrata Seguros"><div><b>Quadrata - Metas</b><small>Quadrata Seguros</small></div></div>
  <div class="tabs" role="group" aria-label="Tipo de acesso">
    <button type="button" data-t="equipe" aria-pressed="true">Vendedora</button>
    <button type="button" data-t="master" aria-pressed="false">Master</button>
  </div>
  <div id="qv"><label for="v">Seu nome</label>
  <select id="v" required><option value="">Selecione…</option><option value="dyovanna">Dyovanna</option><option value="anaclara">Ana Clara</option><option value="alana">Alana</option><option value="fabricio">Fabricio</option></select></div>
  <label for="s" id="lbl" style="margin-top:12px">Seu PIN</label>
  <input id="s" type="password" autocomplete="current-password" required autofocus>
  <div class="hint" id="hint">Para lançar suas vendas e ver o placar.</div>
  <button class="go" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
let tipo="equipe";
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;
  document.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.getElementById("lbl").textContent=tipo==="master"?"Senha master":"Seu PIN";
  document.getElementById("qv").hidden=tipo==="master";document.getElementById("v").required=tipo!=="master";
  document.getElementById("hint").textContent=tipo==="master"?"Lança o ano anterior, ajusta regras e apaga vendas.":"Para lançar suas vendas e ver o placar.";
  document.getElementById("s").focus()});
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo,vendedora:document.getElementById("v").value,senha:document.getElementById("s").value})});
    const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=d.erro||"Não foi possível entrar.";return}
    location.href=d.role==="master"?"/#master":"/#vendedoras"}catch(x){err.textContent="Sem conexão com o servidor."}};
</script>
</body></html>
